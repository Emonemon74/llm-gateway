# Production stack: Caddy (HTTPS) -> API replicas -> Redis/Postgres, plus batch workers,
# Prometheus and Grafana. Only Caddy publishes ports (80/443).
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env.prod up -d --build
#   ...add API replicas:  --scale api=2
name: llm-gateway-prod

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }   # never let logs fill a small disk

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://gateway:${POSTGRES_PASSWORD}@postgres:5432/gateway
  REDIS_URL: redis://redis:6379/0
  ADMIN_TOKEN: ${ADMIN_TOKEN}
  MOCK_BASE_URL: http://mock:9000/v1
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gateway
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway"]
      interval: 5s
      retries: 20
    mem_limit: 512m
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF persistence: queues and budget counters survive a restart. noeviction: when full, fail
    # loudly instead of silently dropping queue entries.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    mem_limit: 320m
    logging: *logging

  migrate:
    build: ..
    image: llm-gateway:local
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    logging: *logging

  api:
    build: ..
    image: llm-gateway:local
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    mem_limit: 512m
    logging: *logging

  worker:
    build: ..
    image: llm-gateway:local
    restart: unless-stopped
    command: ["python", "-m", "app.batch.worker"]
    environment:
      <<: *app-env
      WORKER_METRICS_PORT: "9100"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9100/metrics"]
      interval: 15s
      start_period: 20s
    mem_limit: 384m
    logging: *logging

  mock:
    # Fake upstream so the demo works without paid API keys (and for repeatable load tests).
    image: llm-gateway:local
    restart: unless-stopped
    command: ["uvicorn", "mock_provider.main:app", "--host", "0.0.0.0", "--port", "9000", "--no-access-log"]
    environment: { MOCK_LATENCY_MS: "${MOCK_LATENCY_MS:-200}" }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/healthz"]
      interval: 10s
      start_period: 10s
    depends_on: [migrate]
    mem_limit: 128m
    logging: *logging

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    secrets: [admin_token]
    mem_limit: 256m
    logging: *logging

  grafana:
    image: grafana/grafana:12.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on: [prometheus]
    mem_limit: 256m
    logging: *logging

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data        # certificates: keep, or Let's Encrypt rate limits bite on rebuilds
      - caddyconfig:/config
    depends_on: [api, grafana]
    mem_limit: 96m
    logging: *logging

secrets:
  admin_token:
    environment: ADMIN_TOKEN

volumes:
  pgdata:
  redisdata:
  promdata:
  grafanadata:
  caddydata:
  caddyconfig:
