global:
  scrape_interval: 10s
scrape_configs:
  - job_name: gateway-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/admin_token   # injected by compose from .env.prod
    dns_sd_configs:                                  # one target per replica (docker compose --scale)
      - names: [api]
        type: A
        port: 8000
  - job_name: gateway-worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9100
